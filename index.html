<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <!-- Esto sirve para que la página se adapte a celulares y computadoras -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Septiembre: Mes Patrio</title>

    <style>

        /* Aquí hago que los tamaños de los elementos no se salgan de su lugar */
        * {
            box-sizing: border-box;
        }

        /* Le quito los espacios que trae la página por defecto */
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Pongo la letra que voy a usar en toda la página */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Esta es la parte principal donde va todo el contenido */
        .index {
            width: 100vw;
            height: 100vh;
            position: relative;

            /* Aquí pongo la imagen que usaré como fondo */
            background: url("fondo_index.png") center / 100% 100% no-repeat;
        }

        /* Aquí acomodo el título en la parte de arriba */
        .index-title {
            position: absolute;
            top: 7.5%;
            width: 100%;
            text-align: center;

            color: #000;
            font-size: clamp(38px, 5.3vw, 72px);
            font-weight: 900;
            line-height: 1.05;

            /* Le pongo una sombra blanca para que se pueda leer mejor */
            text-shadow: 2px 2px #fff;
        }

        /* Este es el menú que aparece en el lado izquierdo */
        .side {
            position: absolute;
            top: 51%;
            left: 0;
            width: 17.35%;
            z-index: 5;
        }

        /* Con esto le doy forma a cada botón del menú */
        .side a {
            display: flex;
            align-items: center;
            justify-content: center;

            height: 7.55vh;
            min-height: 45px;

            background: #759d79;
            color: #fff;

            border: 1px solid #fff;
            text-decoration: none;
            text-align: center;

            font-size: clamp(12px, 1.18vw, 18px);
            font-weight: 900;
        }

        /* Cuando paso el mouse por encima cambia el color */
        .side a:hover,
        .side a:active {
            background: #075b18;
        }

        /* Esta es la parte de abajo donde pongo mis datos */
        .foot {
            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 10%;

            /* Esto ayuda a poner el texto centrado */
            display: flex;
            align-items: center;
            justify-content: center;

            background: #ef0505;
            color: #fff;

            text-align: center;
            font-size: clamp(14px, 1.35vw, 21px);
            font-weight: 900;
            line-height: 1.35;
        }
    </style>
</head>

<body>

    <!-- Aquí empieza todo lo que se va a ver en la página -->
    <main class="index">

        <!-- Este es el título principal de mi página -->
        <h1 class="index-title">
            SEPTIEMBRE: MES PATRIO
        </h1>

        <!-- Aquí están las opciones para entrar a las diferentes secciones -->
        <nav class="side">
            <a href="fechas.html">FECHAS IMPORTANTES</a>
            <a href="personajes.html">PERSONAJES ILUSTRES</a>
            <a href="datos.html">DATOS CURIOSOS</a>
            <a href="mitos.html">MITOS</a>
        </nav>

        <!-- Aquí aparecen mis datos al final de la página -->
        <footer class="foot">
            RODARTE GONZALEZ CALEB DANIEL<br>
            GRUPO 5ºI<br>
            No.Control: 24308051281083
        </footer>

    </main>

</body>
</html>
